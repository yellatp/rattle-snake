# Rattle-Snake V2 — self-hosted deployment (api + web, optional ollama).
#
# Offline-first: defaults to LLM_PROVIDER=mock (canned responses) so
#   docker compose up --build            # api + web runs with zero config
#   LLM_PROVIDER=ollama docker compose up --build   # local Ollama via llm profile
#   LLM_PROVIDER=openai LLM_API_KEY=sk-... docker compose up --build
#
# Then open http://localhost:4321

services:
  api:
    build:
      context: .
      target: runner
      args:
        TARGET: api
    image: rattlesnake/api:2.0.0
    ports:
      - "8787:8787"
    environment:
      API_PORT: "8787"
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://ollama:11434/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-llama3.1}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.3}"
      DEBATE_CROSS_TALK_ROUNDS: "${DEBATE_CROSS_TALK_ROUNDS:-2}"
      AGENT_MAX_RETRIES: "${AGENT_MAX_RETRIES:-2}"
      DATABASE_PATH: "/app/data/rattle-snake.db"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
    volumes:
      - rattle-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      target: runner
      args:
        TARGET: web
    image: rattlesnake/web:2.0.0
    ports:
      - "4321:4321"
    environment:
      PORT: "4321"
      HOST: "0.0.0.0"
      PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:8787}"
    depends_on:
      - api
    restart: unless-stopped

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  rattle-data:
  ollama-models:
